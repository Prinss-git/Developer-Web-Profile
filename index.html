<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e7eee2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1428" media="(prefers-color-scheme: dark)" />

    <!-- Fonts: connect early and fetch in parallel with the stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" />

    <!-- Primary meta -->
    <title>Prince Parnada — Full-Stack Developer</title>
    <meta name="description" content="Prince Christian Parnada — Full-Stack Developer & IT Student based in Cebu, Philippines. Built MotoTrack, GlobeScope, and more. Open to internships." />
    <meta name="author" content="Prince Christian Parnada" />
    <meta name="keywords" content="Prince Parnada, Full-Stack Developer, React, Node.js, MySQL, Cebu, Philippines, Web Developer, IT Student" />

    <!-- Open Graph (LinkedIn, Facebook, Viber) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prince-parnada.vercel.app/" />
    <meta property="og:title" content="Prince Parnada — Full-Stack Developer" />
    <meta property="og:description" content="Full-Stack Developer & IT Student based in Cebu, Philippines. Built real-world apps using React, Node.js, and MySQL. Open to internships." />
    <meta property="og:image" content="https://prince-parnada.vercel.app/images/prince-hero.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prince Parnada — Full-Stack Developer" />
    <meta name="twitter:description" content="Full-Stack Developer & IT Student based in Cebu, Philippines. Open to internships." />
    <meta name="twitter:image" content="https://prince-parnada.vercel.app/images/prince-hero.jpg" />

    <!-- Prevent flash of wrong theme -->
    <script>
      try {
        const t = localStorage.getItem('portfolio-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
